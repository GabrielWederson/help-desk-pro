spring:
  application:
    name: help-desk-pro

  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        concurrency: 3
        max-concurrency: 10

rabbit:
  ticketcomplete:
    exchange: ticket-complete.ex

security:
  jwt:
    token:
      secret-key: ${JWT_SECRET}
      expire-length: ${JWT_EXPIRE_LENGTH}

logging:
  level:
    root: INFO
    io.github.gabrielwederson.help_desk_pro: DEBUG
    org.springframework.web: DEBUG
    com.fasterxml.jackson: DEBUG